services:
  - type: web
    name: fish-inventory-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: fish-inventory-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIR
        value: /var/data
      - key: FRONTEND_ORIGIN
        value: https://jamesarellano6002.github.io
