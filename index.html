<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fish Inventory Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #eef5f9; margin: 0; padding: 24px; color: #222; }
    h1 { margin-top: 0; color: #0c4a6e; }
    h2 { font-size: 16px; color: #0c4a6e; margin: 0 0 12px; }
    .container { max-width: 1000px; margin: auto; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .card h3 { margin: 0 0 8px; font-size: 14px; color: #777; font-weight: normal; }
    .card p { margin: 0; font-size: 26px; font-weight: bold; }
    .card small { color: #777; font-size: 13px; }
    .class-card { border-left: 5px solid #0284c7; }
    .panel { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.1); margin-bottom: 24px; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    input, select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: #fff; }
    button { padding: 10px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; color: #fff; }
    .btn-primary { background: #0284c7; }
    .btn-edit { background: #f59e0b; }
    .btn-delete { background: #dc2626; }
    .btn-cancel { background: #6b7280; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
    th { background: #f7fafc; font-size: 13px; color: #666; }
    .low { color: #dc2626; font-weight: bold; }
    .tag { background: #e0f2fe; color: #075985; padding: 3px 8px; border-radius: 12px; font-size: 12px; }
    td button { margin-right: 4px; padding: 6px 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐟 Fish Inventory Dashboard</h1>

    <!-- Overall stats -->
    <div class="cards">
      <div class="card"><h3>Total Fish Types</h3><p id="statTotal">0</p></div>
      <div class="card"><h3>Stock Value</h3><p id="statValue">0</p></div>
      <div class="card"><h3>Low Stock (&lt; 5 kg)</h3><p id="statLow">0</p></div>
    </div>

    <!-- Stats per class -->
    <h2>Stock by Class</h2>
    <div class="cards" id="classCards"></div>

    <!-- Add / Edit Form -->
    <div class="panel">
      <h3 id="formTitle">Add Fish</h3>
      <form id="fishForm">
        <input type="hidden" id="fishId" />
        <input type="text" id="name" placeholder="Fish name" required />
        <select id="fish_class" required>
          <option value="">Select class</option>
          <option>Bony Fish</option>
          <option>Cartilaginous Fish</option>
          <option>Jawless Fish</option>
        </select>
        <input type="number" id="price" placeholder="Price per kg" step="0.01" min="0" required />
        <input type="number" id="quantity" placeholder="Quantity (kg)" min="0" required />
        <button type="submit" class="btn-primary" id="submitBtn">Add</button>
        <button type="button" class="btn-cancel" id="cancelBtn" style="display:none">Cancel</button>
      </form>
    </div>

    <!-- Table -->
    <div class="panel">
      <table>
        <thead>
          <tr><th>ID</th><th>Name</th><th>Class</th><th>Price/kg</th><th>Qty (kg)</th><th>Actions</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const CURRENCY = '$'; // change to '₱' if you prefer pesos

    const form = document.getElementById('fishForm');
    const tableBody = document.getElementById('tableBody');
    const cancelBtn = document.getElementById('cancelBtn');

    const money = (n) => CURRENCY + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

    async function loadStats() {
      const s = await (await fetch('/api/stats')).json();
      document.getElementById('statTotal').textContent = s.totalFish;
      document.getElementById('statValue').textContent = money(s.stockValue);
      document.getElementById('statLow').textContent = s.lowStock;

      document.getElementById('classCards').innerHTML = s.byClass.length
        ? s.byClass.map(c => `
            <div class="card class-card">
              <h3>${esc(c.fish_class)}</h3>
              <p>${c.totalQty} kg</p>
              <small>${c.species} type${c.species > 1 ? 's' : ''}</small>
            </div>`).join('')
        : '<div class="card">No data yet</div>';
    }

    async function loadFish() {
      const fish = await (await fetch('/api/fish')).json();
      tableBody.innerHTML = fish.map(f => `
        <tr>
          <td>${f.id}</td>
          <td>${esc(f.name)}</td>
          <td><span class="tag">${esc(f.fish_class)}</span></td>
          <td>${money(f.price)}</td>
          <td class="${f.quantity < 5 ? 'low' : ''}">${f.quantity}</td>
          <td>
            <button class="btn-edit" onclick='editFish(${JSON.stringify(f)})'>Edit</button>
            <button class="btn-delete" onclick="deleteFish(${f.id})">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function refresh() { loadFish(); loadStats(); }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('fishId').value;
      const body = {
        name: document.getElementById('name').value,
        fish_class: document.getElementById('fish_class').value,
        price: document.getElementById('price').value,
        quantity: document.getElementById('quantity').value
      };
      await fetch(id ? `/api/fish/${id}` : '/api/fish', {
        method: id ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      resetForm();
      refresh();
    });

    function editFish(f) {
      document.getElementById('fishId').value = f.id;
      document.getElementById('name').value = f.name;
      document.getElementById('fish_class').value = f.fish_class;
      document.getElementById('price').value = f.price;
      document.getElementById('quantity').value = f.quantity;
      document.getElementById('formTitle').textContent = 'Edit Fish';
      document.getElementById('submitBtn').textContent = 'Update';
      cancelBtn.style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteFish(id) {
      if (!confirm('Delete this fish?')) return;
      await fetch(`/api/fish/${id}`, { method: 'DELETE' });
      refresh();
    }

    function resetForm() {
      form.reset();
      document.getElementById('fishId').value = '';
      document.getElementById('formTitle').textContent = 'Add Fish';
      document.getElementById('submitBtn').textContent = 'Add';
      cancelBtn.style.display = 'none';
    }

    cancelBtn.addEventListener('click', resetForm);
    refresh();
  </script>
</body>
</html>
